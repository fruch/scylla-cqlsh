# temporary: diagnose the scylla-driver crash on Windows; delete before merging
name: debug windows driver
on: pull_request
jobs:
  debug:
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: WSL + Scylla
        shell: pwsh
        run: |
          wsl --install -d Ubuntu-24.04 --no-launch
          Start-Process -WindowStyle Hidden wsl -ArgumentList '-d','Ubuntu-24.04','-u','root','--','sleep','infinity'
          wsl -d Ubuntu-24.04 -u root -- bash -euxc "curl -fsSL https://get.docker.com | sh; service docker start || true; sysctl -w fs.aio-max-nr=1048576"
          wsl -d Ubuntu-24.04 -u root -- docker run -d --name scylla -p 9042:9042 scylladb/scylla:2026.3.4 --smp 2 --memory 2G --overprovisioned 1 --broadcast-rpc-address 127.0.0.1
      - name: diagnose
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pip install -r ./pylib/requirements.txt
          Get-Command python | Format-List Source
          pip show scylla-driver
          function Try($code) {
            python -X faulthandler -u -c $code
            "exit code: $LASTEXITCODE (0x{0:X})" -f $LASTEXITCODE
          }
          Try "import cassandra; print(cassandra.__file__)"
          Try "import cassandra.cluster as c; print('cluster ok', c.Cluster.connection_class)"
          Try "import socket; socket.create_connection(('127.0.0.1', 9042), timeout=5).close(); print('tcp ok')"
          Start-Sleep 90
          Try "import logging,sys; logging.basicConfig(level=logging.DEBUG, stream=sys.stdout); from cassandra.cluster import Cluster; print(Cluster(['127.0.0.1']).connect().execute('select release_version from system.local').one())"
          Try "import logging,sys; logging.basicConfig(level=logging.DEBUG, stream=sys.stdout); from cassandra.cluster import Cluster; from cassandra.io.asyncioreactor import AsyncioConnection; print(Cluster(['127.0.0.1'], connection_class=AsyncioConnection).connect().execute('select release_version from system.local').one())"
          Get-WinEvent -LogName Application -MaxEvents 20 | Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting' } | Format-List TimeCreated, Message
